[project]
name = "aegis"
version = "0.4.0"
description = "Sovereign PII proxy for LLMs and agents"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "redis>=5.0",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "gliner>=0.2.30",
    "openai>=3.57.0",
    "tiktoken>=0.14.0",
    "transformers>=4.51.3,<5",
    "protobuf>=7.36.2",
    "torch>=2.15.0,<3",
    "onnx>=1.17",
    "onnxruntime>=1.32.0",
]

[project.urls]
Repository = "https://github.com/hassanismailtech/seclume"
Issues = "https://github.com/hassanismailtech/seclume/issues"

[project.scripts]
aegis = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "packs"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "asgi-lifespan>=2.1",
    "anthropic>=2.12.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
