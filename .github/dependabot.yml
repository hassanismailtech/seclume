version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      python-weekly:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directories:
      - "/frontend"
      - "/website"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      npm-weekly:
        patterns: ["*"]
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      actions-weekly:
        patterns: ["*"]
