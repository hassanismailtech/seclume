name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  claims:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
      - name: Check public claims
        run: uv run --no-project --python 3.12 python backend/scripts/claims_lint.py
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run: { shell: bash }
    steps:
      - uses: actions/checkout@v7
      - name: Start native Redis without persistence
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends redis-server
          sudo systemctl stop redis-server
          redis-server --bind 127.0.0.1 --port 6379 --save "" --appendonly no \
            --daemonize yes --pidfile "$RUNNER_TEMP/aegis-redis.pid" \
            --logfile "$RUNNER_TEMP/aegis-redis.log"
          for attempt in {1..20}; do
            if redis-cli ping | grep -qx PONG; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Prepare verified Caddy for ingress tests
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/caddyserver/caddy/releases/download/v2.11.9/caddy_2.11.9_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/caddy.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/caddyserver/caddy/releases/download/v2.11.9/caddy_2.11.9_checksums.txt \
            --output "$RUNNER_TEMP/caddy-checksums.txt"
          awk '$2 == "caddy_2.11.9_linux_amd64.tar.gz" { print $1 "  caddy.tar.gz" }' \
            "$RUNNER_TEMP/caddy-checksums.txt" > "$RUNNER_TEMP/caddy.sha512"
          (cd "$RUNNER_TEMP" && sha512sum --check caddy.sha512)
          tar -xzf "$RUNNER_TEMP/caddy.tar.gz" -C "$RUNNER_TEMP" caddy
          echo "CADDY_BIN=$RUNNER_TEMP/caddy" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-gliner-${{ runner.os }}-${{ hashFiles('backend/uv.lock') }}
      - run: uv sync --frozen
        working-directory: backend
      - name: Unit, integration, and leak tests
        run: uv run pytest -q
        working-directory: backend
        env:
          REDIS_URL: redis://localhost:6379/0
          NER_TIMEOUT_MS: "10000"
      - name: Pattern benchmark
        run: uv run python scripts/bench_scrub.py
        working-directory: backend
        env:
          NER_ENABLED: "false"
      - name: Dependency audit
        run: uvx pip-audit
        working-directory: backend
      - name: Stop native Redis
        if: always()
        run: redis-cli shutdown nosave
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions: { contents: read }
    defaults:
      run: { shell: bash }
    env:
      SECLUME_IMAGE: aegis:ci-${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose and build images
        run: |
          docker compose config --quiet
          docker compose build aegis mock-upstream
          docker image inspect "$SECLUME_IMAGE" > /dev/null
      - name: Refuse unauthenticated wildcard binding
        run: |
          docker create --name startup-guard \
            -e BIND_HOST=0.0.0.0 -e AEGIS_KEYS_FILE= \
            -e AEGIS_INSECURE_DEV=false -e NER_ENABLED=false "$SECLUME_IMAGE"
          docker start startup-guard
          exit_code=$(timeout 30s docker wait startup-guard)
          test "$exit_code" -gt 0
          docker logs startup-guard 2>&1 | grep -Fq 'Refusing to start: BIND_HOST is not loopback'
      - name: Check Compose health
        run: |
          docker compose up --detach --no-build --wait --wait-timeout 180
          docker compose exec -T redis redis-cli ping | grep -qx PONG
          docker compose exec -T aegis python -c \
            "import json, urllib.request; r = json.load(urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=5)); assert r['status'] == 'ready' and r['redis'] == 'ok'"
          docker compose ps
      - name: Check isolated playground deployment
        env:
          CORS_ORIGINS: http://localhost:3000
        run: |
          docker compose down --remove-orphans
          docker compose -f deploy/compose.playground.yml -p aegis-playground-ci config --quiet
          docker compose -f deploy/compose.playground.yml -p aegis-playground-ci \
            up --detach --no-build --wait --wait-timeout 180
          docker compose -f deploy/compose.playground.yml -p aegis-playground-ci exec -T aegis \
            python -c "import json,sys,urllib.request; f=json.load(sys.stdin)[0]; q=urllib.request.Request('http://127.0.0.1:8000/v1/playground/scrub',data=json.dumps({'text':f['text']}).encode(),headers={'Content-Type':'application/json'}); r=json.load(urllib.request.urlopen(q,timeout=10)); assert r['mode']=='lite' and 'reinjected_reply' not in r; assert all(v not in r['scrubbed'] for v in f['planted'])" \
            < demo/prompts.json
          test "$(docker compose -f deploy/compose.playground.yml -p aegis-playground-ci \
            exec -T redis redis-cli exists aegis:events aegis:stats)" = "0"
      - name: Remove test containers
        if: always()
        run: |
          if docker container inspect startup-guard > /dev/null 2>&1; then
            docker rm --force startup-guard
          fi
          docker compose down --remove-orphans
          CORS_ORIGINS=http://localhost:3000 docker compose \
            -f deploy/compose.playground.yml -p aegis-playground-ci down --remove-orphans
  playground-networking:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions: { contents: read }
    defaults:
      run: { shell: bash }
    env:
      SECLUME_IMAGE: aegis:playground-networking-${{ github.sha }}
      CORS_ORIGINS: http://localhost:3000
      COMPOSE_FILE: deploy/compose.playground.yml
      COMPOSE_PROJECT_NAME: aegis-playground-networking-ci
    steps:
      - uses: actions/checkout@v7
      - name: Record Docker versions and validate profile
        run: |
          docker version
          docker compose version
          docker compose config --quiet
          python3 - <<'PY'
          import errno
          import socket
          for port in (8000, 6379):
              with socket.socket() as connection:
                  connection.settimeout(2)
                  assert connection.connect_ex(('127.0.0.1', port)) == errno.ECONNREFUSED, 'Test port is not free'
          print('Host test ports are free')
          PY
      - name: Build local runtime image
        run: docker build --target runtime --tag "$SECLUME_IMAGE" backend
      - name: Start standalone playground profile
        run: docker compose up --detach --no-build --wait --wait-timeout 180
      - name: Scrub through the host loopback port
        run: |
          status=$(python3 -c "import json,sys; print(json.dumps({'text':json.load(sys.stdin)[0]['text']}))" \
            < demo/prompts.json | curl --fail --silent --show-error \
            --connect-timeout 5 --max-time 15 \
            --header 'Content-Type: application/json' --data-binary @- \
            --output "$RUNNER_TEMP/playground-response.json" --write-out '%{http_code}' \
            http://127.0.0.1:8000/v1/playground/scrub)
          test "$status" = 200
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          fixture = json.loads(Path('demo/prompts.json').read_text())[0]
          response = json.loads((Path(os.environ['RUNNER_TEMP']) / 'playground-response.json').read_text())
          assert response['mode'] == 'lite' and 'reinjected_reply' not in response
          assert re.search(r'\[\[[A-Z_]+_\d+\]\]', response['scrubbed'])
          assert all(value not in json.dumps(response) for value in fixture['planted'])
          print('Host playground POST returned 200 with scrubbed-only JSON')
          PY
      - name: Verify published bindings and private Redis
        run: |
          redis_id=$(docker compose ps --quiet redis)
          proxy_id=$(docker compose ps --quiet aegis)
          test -n "$redis_id" && test -n "$proxy_id"
          docker inspect "$redis_id" "$proxy_id" > "$RUNNER_TEMP/playground-containers.json"
          python3 - <<'PY'
          import errno
          import json
          import os
          import socket
          from pathlib import Path
          redis, proxy = json.loads((Path(os.environ['RUNNER_TEMP']) / 'playground-containers.json').read_text())
          assert not redis['HostConfig']['PortBindings']
          assert not any((redis['NetworkSettings']['Ports'] or {}).values())
          expected = {'8000/tcp': [{'HostIp': '127.0.0.1', 'HostPort': '8000'}]}
          assert proxy['HostConfig']['PortBindings'] == expected
          assert proxy['NetworkSettings']['Ports'] == expected
          assert set(redis['NetworkSettings']['Networks']) == {os.environ['COMPOSE_PROJECT_NAME'] + '_private'}
          assert set(proxy['NetworkSettings']['Networks']) == {os.environ['COMPOSE_PROJECT_NAME'] + suffix for suffix in ('_private', '_default')}
          with socket.socket() as connection:
              connection.settimeout(2)
              assert connection.connect_ex(('127.0.0.1', 6379)) == errno.ECONNREFUSED, 'Host Redis port is reachable or probe failed'
          print('Proxy publishes only 127.0.0.1:8000; Redis has no published port and host port 6379 refuses connections')
          PY
          test "$(docker compose exec -T redis redis-cli exists aegis:events aegis:stats)" = "0"
          echo 'Playground emitted no Telemetry Events'
      - name: Remove playground test containers
        if: always()
        run: docker compose down --remove-orphans
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npm run lint && npm run build
        working-directory: frontend
      - run: npm audit --omit=dev --audit-level=moderate
        working-directory: frontend
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: website/package-lock.json }
      - run: npm ci
        working-directory: website
      - run: npm test
        working-directory: website
      - run: npm run lint && npm run build
        working-directory: website
      - run: npm audit --omit=dev --audit-level=moderate
        working-directory: website
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
